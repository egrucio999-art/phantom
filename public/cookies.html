<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка сессии</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0d0f12; color: #e8eaed; padding: 20px; }
        h2 { text-align: center; }
        textarea { width: 100%; height: 200px; background: #13161b; color: #e8eaed; border: 1px solid #232830; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 14px; }
        button { width: 100%; padding: 15px; background: #5b8db8; color: #0d0f12; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .status { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <h2>📥 Загрузка сессии</h2>
    <p>1. Установи расширение "Cookie-Editor" (Chrome/Firefox).<br>
       2. Зайди на Upwork и залогинься.<br>
       3. Нажми на расширение → Export → JSON.<br>
       4. Вставь скопированный JSON сюда:</p>
    <textarea id="cookiesInput" placeholder="Вставь JSON сюда..."></textarea>
    <button id="saveBtn" onclick="saveCookies()">Сохранить сессию</button>
    <div class="status" id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function saveCookies() {
            const input = document.getElementById('cookiesInput').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('saveBtn');

            if (!input) {
                status.textContent = "❌ Вставь JSON!";
                return;
            }

            btn.disabled = true;
            status.textContent = "⏳ Отправка...";

            try {
                const response = await fetch('/api/save-cookies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookies: input })
                });

                if (response.ok) {
                    status.textContent = "✅ Сессия сохранена! Можешь закрыть окно.";
                    tg.close();
                } else {
                    status.textContent = "❌ Ошибка сервера.";
                }
            } catch (e) {
                status.textContent = "❌ Ошибка сети: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
